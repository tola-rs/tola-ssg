name: Set up the TypeScript workspace
description: Install the repository-pinned Deno runtime and the frozen workspace dependencies.
runs:
  using: composite
  steps:
    - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      with:
        deno-version-file: .tool-versions
        cache: true
    - name: Install frozen workspace dependencies
      shell: bash
      run: deno ci
