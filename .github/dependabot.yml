# Two groups per ecosystem keep the PR count flat: `*-minor-patch` is the lane
# .github/workflows/dependabot-auto-merge.yml merges once Check is green, `*-major`
# is reviewed by hand. Order matters, Dependabot assigns the first matching group.
# Open bumps never rebase on a base-branch update; only the monthly run moves a pull request.
version: 2
updates:
  # `directory: "/"` does not reach the composite actions, hence the glob entry.
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/**/*"
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Shanghai # matches this repository's commit times (UTC+8)
    rebase-strategy: disabled
    cooldown:
      default-days: 7 # a week of soak instead of the 3-day default
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      actions-major:
        patterns: ["*"]
        update-types: [major]
    open-pull-requests-limit: 3

  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    rebase-strategy: disabled
    cooldown:
      default-days: 7
    versioning-strategy: lockfile-only
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      cargo-major:
        patterns: ["*"]
        update-types: [major]
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "tola-*" # internal crates released in lockstep
      - dependency-name: "typst*" # the family ships as one release; owned by hand
      - dependency-name: "oxc*"

  # extensions/vscode dependencies, with a committed package-lock.json.
  - package-ecosystem: npm
    directory: "/extensions/vscode"
    schedule:
      interval: monthly
    rebase-strategy: disabled
    cooldown:
      default-days: 7
    versioning-strategy: increase-if-necessary
    groups:
      vscode-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      vscode-major:
        patterns: ["*"]
        update-types: [major]
    open-pull-requests-limit: 3

  - package-ecosystem: nix
    directory: "/"
    schedule:
      interval: monthly
    rebase-strategy: disabled
    cooldown:
      default-days: 7
    groups:
      # Commit-pinned inputs carry no semantic version, so splitting by update type
      # would leave most bumps ungrouped.
      nix-inputs:
        patterns: ["*"]
    ignore:
      - dependency-name: "nixpkgs" # the development shell supplies the pinned toolchains
