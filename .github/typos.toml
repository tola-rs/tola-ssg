# Scope: prose and source. Vendored mirrors (`docs/`), redistributed licence documents,
# the pinyin tables under `crates/tola-pronunciations/data/`, and build output are data.
[files]
extend-exclude = [
  ".git",
  ".jj",
  "docs",
  "target",
  "node_modules",
  "e2e/test-results",
  "e2e/playwright-report",
  "extensions/vscode/dist",
  "extensions/vscode/.vscode-test",
  "crates/tola-pronunciations/data",
  "crates/tola-pronunciations/licenses",
]

[default.extend-words]
# Kana transliteration samples in the romanization tests, the suffix list the watcher
# uses to recognize editor artifacts, and the prefix the checker splits out of
# hyphenated words such as `mis-parses`.
ba = "ba"
bck = "bck"
fo = "fo"
gya = "gya"
mis = "mis"
mye = "mye"
myu = "myu"
# Percent-encoded "café" examples, whose decoding the URL tests assert.
caf = "caf"
# Deliberate misspellings in fixtures, and upstream spellings quoted verbatim:
# correct where they stand, so the checker must not rewrite them.
adress = "adress"
alikes = "alikes"
asert = "asert"
boundarys = "boundarys"
bui = "bui"
descriptio = "descriptio"
documnt = "documnt"
hel = "hel"
ment = "ment"
nam = "nam"
nd = "nd"
pronounciation = "pronounciation"
pronounciations = "pronounciations"
stauts = "stauts"
titel = "titel"
ue = "ue"
underlaying = "underlaying"
