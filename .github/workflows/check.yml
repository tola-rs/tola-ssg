name: Check
on:
  workflow_call:
  # A manual run carries the complete set only when its `full` input asks for it.
  workflow_dispatch:
    inputs:
      full:
        description: "Also run the Windows matrix, e2e, and the extension suite."
        type: boolean
        default: false
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches:
      - main

concurrency:
  # Reusable calls inherit the caller's workflow name; never share its release group.
  # Separate manual runs so releases of different tags cannot cancel each other.
  group: check-workflow-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || '' }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # One place decides which checks a run covers. A release takes everything; a push asks with
  # `[full-ci]` in its message, a pull request with the `full-ci` label, and a manual run with
  # its `full` input.
  scope:
    name: Decide which checks this run covers
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.decide.outputs.full }}
      watch: ${{ steps.decide.outputs.watch }}
    steps:
      # The diff against the base decides whether the macOS leg runs.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read the request
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ github.event.inputs.full || 'false' }}
          MESSAGE: ${{ github.event.head_commit.message || '' }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          full=false
          watch=true
          case "$EVENT" in
            workflow_call) full=true ;;
            workflow_dispatch) if [ "$REQUESTED" = "true" ]; then full=true; fi ;;
            push) case "$MESSAGE" in *'[full-ci]'*) full=true ;; esac ;;
            pull_request) case ",$LABELS," in *,full-ci,*) full=true ;; esac ;;
          esac
          # The macOS leg takes a full run, and otherwise only a change that reaches the
          # FSEvents backend. A rewritten branch can lose the base commit; then the diff
          # fails and the leg runs.
          base=''
          case "$EVENT" in
            pull_request) base="$BASE" ;;
            push) base="$BEFORE" ;;
          esac
          if [ -n "$base" ] && [ "$full" = false ]; then
            if ! changed=$(git diff --name-only "${base}...HEAD" 2>/dev/null); then
              watch=true
            elif printf '%s\n' "$changed" | grep -Eq '^(src/dev/watch/|src/dev/rebuild\.rs$|Cargo\.(toml|lock)$|just/|\.github/(workflows/check\.yml|actions/)|nix/)'; then
              watch=true
            else
              watch=false
            fi
          fi
          printf 'full=%s\n' "$full" >> "$GITHUB_OUTPUT"
          printf 'watch=%s\n' "$watch" >> "$GITHUB_OUTPUT"

  static-check:
    name: Check formatting, lints, spelling, versions, and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-typescript
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
          cache-key: check-static
          cache-on-failure: true
      - name: Check formatting, lints, test names, and synchronized versions
        run: just quality version-check
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - name: Check dependency licences and advisories
        run: just deny
      - name: Check spelling in sources and prose
        uses: crate-ci/typos@00f422f3b19c57bc6338715ebfe3316d38768461 # v1.50.3
        with:
          config: ./.github/typos.toml
      - name: Install shellcheck for actionlint
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: shellcheck
          version: 1.0
      - name: Install actionlint
        run: |
          archive="$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          sudo install -m755 "$RUNNER_TEMP/actionlint" /usr/local/bin/actionlint
      - name: Check workflow syntax
        run: just workflows
      - name: Check that action pins carry the release they name
        uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
        with:
          fix: false
          skip_push: true
          verify: true

  cargo:
    name: Check (just ${{ matrix.checks }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - checks: clippy
            components: clippy
            cache-key: check-clippy
          - checks: docs
            components: ''
            cache-key: check-docs
          - checks: build-library
            components: ''
            cache-key: check-build-library
          - checks: test-nextest
            components: ''
            cache-key: check-test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: ${{ matrix.components }}
          cache-key: ${{ matrix.cache-key }}
          cache-on-failure: true
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        if: ${{ matrix.checks == 'test-nextest' }}
        with:
          tool: nextest@0.9.149
          fallback: none
      - run: just ${{ matrix.checks }}

  macos-watch:
    name: Check the watcher on macOS
    runs-on: macos-latest
    timeout-minutes: 45
    needs: [scope]
    # Only macOS compiles the FSEvents backend, and the Nix check cannot start its stream.
    if: ${{ needs.scope.outputs.watch == 'true' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: check-macos
          cache-on-failure: true
      - name: Run the gated fsevent tests
        run: cargo test --locked -p tola --bin tola --all-features fsevents_tests

  minimum-rust:
    name: Check minimum Rust
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read minimum Rust from the workspace manifest
        id: minimum-rust
        run: |
          rust_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["rust-version"])')"
          printf 'rust-version=%s\n' "$rust_version" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ steps.minimum-rust.outputs.rust-version }}
          cache-key: check-minimum-rust
      - name: Compile all workspace targets and features on minimum Rust
        run: cargo check --locked --workspace --all-targets --all-features

  maintenance-scripts:
    name: Check maintenance scripts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-typescript
      - uses: ./.github/actions/setup-rust
      - run: just scripts::check

  windows-gnu:
    name: Check Windows x86_64-pc-windows-gnu
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          target: x86_64-pc-windows-gnu
          cache-key: check-windows-gnu
          cache-on-failure: true
      - name: Install MinGW cross compiler
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: gcc-mingw-w64-x86-64
          version: 1.0
      - run: just windows::gnu

  windows-msvc:
    name: Check Windows x86_64-pc-windows-msvc
    runs-on: windows-latest
    timeout-minutes: 45
    # The native Windows compile and test suite is the slow leg, so it waits for a run that
    # carries the complete set; the GNU cross-check above rides every push.
    needs: [scope]
    if: ${{ needs.scope.outputs.full == 'true' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          target: x86_64-pc-windows-msvc
          cache-key: check-windows
          cache-on-failure: true
      - run: just windows::msvc

  e2e:
    name: Exercise CLI, development, and site behavior
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [scope]
    if: ${{ needs.scope.outputs.full == 'true' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-typescript
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: check-e2e
          cache-on-failure: true
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/deno.json') }}
      - name: Install Chromium
        run: just e2e::setup --with-deps
      - name: Type-check and exercise CLI, development, and site behavior
        env:
          TOLA_E2E_PROFILE: release
        run: just e2e::run
      - name: Upload Playwright report and failure artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results
          overwrite: true
          path: |
            e2e/playwright-report/
            e2e/test-results/playwright/
          if-no-files-found: ignore
          retention-days: 7

  vscode:
    name: Check and package the VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [scope]
    # VS Code's own download and the integration host are the slow part; the extension is
    # still type-checked and packaged by every push through `just quality` and the release.
    if: ${{ needs.scope.outputs.full == 'true' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-typescript
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: check-vscode
          cache-on-failure: true
      - name: Install the headless VS Code display
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: xvfb
          version: 1.0
      - name: Run integration tests and create a type-checked VSIX without publishing
        run: just vscode::check
      - name: Upload the packaged extension
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-vsix
          overwrite: true
          path: extensions/vscode/*.vsix
          if-no-files-found: error
          retention-days: 7

  nix:
    name: Evaluate the Nix flake
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0
      - uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: just flake
