name: Private module

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'

concurrency:
  group: private-module
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  accept:
    name: Fetch private module (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: private-module-${{ matrix.os }}
          cache-on-failure: true
      - name: Build tola
        run: cargo build --locked -p tola
      - name: Run private-module checks
        env:
          TOLA_CI_HTTPS_TOKEN: ${{ secrets.TOLA_CI_HTTPS_TOKEN }}
          TOLA_CI_SSH_KEY: ${{ secrets.TOLA_CI_SSH_KEY }}
          TOLA_CI_SSH_KNOWN_HOSTS: ${{ secrets.TOLA_CI_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          bin=target/debug/tola
          if [ "${RUNNER_OS}" = "Windows" ]; then bin="${bin}.exe"; fi
          export TOLA_BIN="$PWD/${bin}"
          "${TOLA_BIN}" nu tools/private-module.nu --out "$PWD/digest.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.os }}
          path: digest.txt
          if-no-files-found: error

  compare:
    name: Compare platform digests
    needs: accept
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          path: digests
      - name: Require one digest
        run: |
          set -euo pipefail
          cat digests/digest-*/digest.txt
          test "$(cat digests/digest-*/digest.txt | sort -u | wc -l)" -eq 1
