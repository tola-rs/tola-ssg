name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag matching the workspace version, with or without a prerelease suffix."
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Check selected release source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.selection.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: hustcer/setup-nu@eacad52a4634c4f8d17a94916f93be6856861b9c # v3.29
        with:
          version: 0.116.1
      - uses: ./.github/actions/setup-rust
      - name: Check requested tag at the invocation commit
        id: selection
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag || '' }}
        run: |
          set -euo pipefail
          tag="${DISPATCH_TAG:-$GITHUB_REF_NAME}"
          nu tools/release/check.nu source "$tag" --commit "$GITHUB_SHA"
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            git rev-parse --verify "refs/tags/$tag^{commit}" >/dev/null
          fi
          # A release tag must name a commit that reached the default branch, so a
          # published version always exists in the main line of development.
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/${{ github.event.repository.default_branch }}"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

  packages:
    name: Check workspace packages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: validate
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: hustcer/setup-nu@eacad52a4634c4f8d17a94916f93be6856861b9c # v3.29
        with:
          version: 0.116.1
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: release-packages
      - name: Verify workspace packages for the selected release
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: nu tools/release/check.nu packages "$RELEASE_TAG" --commit "$GITHUB_SHA"
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-about@0.9.2
          fallback: none
      - name: Generate release license material
        run: |
          just licenses
          nu tools/release/package.nu licenses --output "$RUNNER_TEMP/release-licenses"
      - name: Upload release license material
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifact-licenses
          overwrite: true
          path: ${{ runner.temp }}/release-licenses/*
          if-no-files-found: error

  checks:
    name: Run complete Check workflow
    needs: validate
    # A local reusable workflow uses this invocation's commit, as do all checkouts.
    uses: ./.github/workflows/check.yml

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static musl binaries are built natively on each Linux architecture.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            packages: musl-tools
          # The hosted ARM runners are reclaimed under memory pressure while several crates are
          # code-generated at once, so the two aarch64 builds compile fewer crates at a time.
          # The binary settings stay unchanged.
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            packages: musl-tools
            cargo_jobs: '2'
          # The GNU-linked Linux archives link the system OpenSSL each runner carries.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            packages: ''
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            packages: ''
            cargo_jobs: '2'
          - target: aarch64-apple-darwin
            os: macos-latest
            packages: ''
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            packages: ''
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: hustcer/setup-nu@eacad52a4634c4f8d17a94916f93be6856861b9c # v3.29
        with:
          version: 0.116.1
      - uses: ./.github/actions/setup-rust
        with:
          target: ${{ matrix.target }}
          cache-key: release-${{ matrix.target }}
          cache-on-failure: true
      - name: Install the musl C toolchain
        if: ${{ matrix.packages != '' }}
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: ${{ matrix.packages }}
          version: 1.0
      - name: Give the Linux build more swap to link in
        if: ${{ runner.os == 'Linux' }}
        run: |
          # This link once drove the Linux runners' free memory to 200 MB and got the runner
          # reclaimed. The image already mounts its own swapfile at /swapfile, so add a second one
          # beside it as headroom.
          sudo fallocate -l 16G /swapfile.tola
          sudo chmod 600 /swapfile.tola
          sudo mkswap --quiet /swapfile.tola
          sudo swapon /swapfile.tola
          free -m
      - name: Build and verify release archive
        env:
          TARGET: ${{ matrix.target }}
          CARGO_BUILD_JOBS: ${{ matrix.cargo_jobs }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            # Real numbers for the next failure or success.
            ( while :; do
                echo "runner-resources $(date -u +%H:%M:%S)" \
                  "mem_available_mb=$(awk '/^MemAvailable:/ {print int($2 / 1024)}' /proc/meminfo)" \
                  "swap_free_mb=$(awk '/^SwapFree:/ {print int($2 / 1024)}' /proc/meminfo)" \
                  "disk_free_mb=$(df -m --output=avail . | tail -n 1 | tr -d ' ')"
                sleep 60
              done ) &
            sampler=$!
            trap 'kill "$sampler"' EXIT
          fi
          if [ -z "${CARGO_BUILD_JOBS:-}" ]; then
            unset CARGO_BUILD_JOBS
          fi
          nu tools/release/package.nu build "$TARGET" --output artifacts
      - name: Upload verified artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifact-${{ matrix.target }}
          overwrite: true
          path: artifacts/*
          if-no-files-found: error
  release:
    name: Publish verified release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [validate, checks, packages, build]
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: hustcer/setup-nu@eacad52a4634c4f8d17a94916f93be6856861b9c # v3.29
        with:
          version: 0.116.1
      - uses: ./.github/actions/setup-rust
      - name: Download verified build artifacts outside the checkout
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifact-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-archives
      - name: Generate notes for the selected commit
        env:
          RELEASE_NOTES: ${{ runner.temp }}/release-notes.md
        run: |
          set -euo pipefail
          nu tools/release/notes.nu \
            --tag "$RELEASE_TAG" \
            --commit "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --output "$RELEASE_NOTES"
      - name: Publish the verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ARCHIVES: ${{ runner.temp }}/release-archives
          RELEASE_NOTES: ${{ runner.temp }}/release-notes.md
        run: |
          set -euo pipefail
          nu tools/release/publish.nu \
            --tag "$RELEASE_TAG" \
            --commit "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --archives "$RELEASE_ARCHIVES" \
            --notes "$RELEASE_NOTES"
