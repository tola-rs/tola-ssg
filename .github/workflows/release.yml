name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag matching the workspace version (e.g. v0.8.0 or v0.8.0-pre.1)."
        required: true
        type: string
      mode:
        description: "Create a release, or update its builds and tag to the selected commit while preserving or regenerating its title and notes."
        required: true
        type: choice
        default: create
        options:
          - create
          - update-preserve-notes
          - update-regenerate-notes
  push:
    tags:
      - 'v*'

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Check selected release source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.selection.outputs.tag }}
      mode: ${{ steps.selection.outputs.mode }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-typescript
      - uses: ./.github/actions/setup-rust
      - name: Check requested tag at the invocation commit
        id: selection
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag || '' }}
          RELEASE_MODE: ${{ github.event.inputs.mode || 'create' }}
        run: |
          set -euo pipefail
          tag="${DISPATCH_TAG:-$GITHUB_REF_NAME}"
          deno run -A scripts/release/check.ts source "$tag" --commit "$GITHUB_SHA" --mode "$RELEASE_MODE"
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            git rev-parse --verify "refs/tags/$tag^{commit}" >/dev/null
          fi
          # A release tag must name a commit that reached the default branch, so a
          # published version always exists in the main line of development.
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/${{ github.event.repository.default_branch }}"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'mode=%s\n' "$RELEASE_MODE" >> "$GITHUB_OUTPUT"

  packages:
    name: Check workspace packages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: validate
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-typescript
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: release-packages
      - name: Verify workspace packages for the selected release mode
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_MODE: ${{ needs.validate.outputs.mode }}
        run: deno run -A scripts/release/check.ts packages "$RELEASE_TAG" --commit "$GITHUB_SHA" --mode "$RELEASE_MODE"
      - name: Verify freshly packaged sources
        run: just package-check
      - name: Generate release license material
        run: |
          cargo install cargo-about --version 0.9.2 --features cli --locked
          just licenses
          deno run --allow-read --allow-write --allow-env scripts/release/package.ts licenses --output "$RUNNER_TEMP/release-licenses"
      - name: Upload release license material
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifact-licenses
          overwrite: true
          path: ${{ runner.temp }}/release-licenses/*
          if-no-files-found: error

  checks:
    name: Run complete Check workflow
    needs: validate
    # A local reusable workflow uses this invocation's commit, as do all checkouts.
    uses: ./.github/workflows/check.yml
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static musl binaries are built natively on each Linux architecture.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            packages: musl-tools
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            packages: musl-tools
          # The GNU-linked Linux archives link the system OpenSSL each runner carries.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            packages: ''
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            packages: ''
          - target: aarch64-apple-darwin
            os: macos-latest
            packages: ''
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            packages: ''
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-typescript
      - uses: ./.github/actions/setup-rust
        with:
          target: ${{ matrix.target }}
          cache-key: release-${{ matrix.target }}
          cache-on-failure: true
      - name: Install the musl C toolchain
        if: ${{ matrix.packages != '' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes ${{ matrix.packages }}
      - name: Build and verify release archive
        env:
          TARGET: ${{ matrix.target }}
        run: deno run --allow-read --allow-write --allow-run --allow-env scripts/release/package.ts build "$TARGET" --output artifacts
      - name: Upload verified artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifact-${{ matrix.target }}
          overwrite: true
          path: artifacts/*
          if-no-files-found: error
  release:
    name: Publish verified release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [validate, checks, packages, build]
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_MODE: ${{ needs.validate.outputs.mode }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-typescript
      - uses: ./.github/actions/setup-rust
      - name: Download verified build artifacts outside the checkout
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifact-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-archives
      - name: Generate notes for the selected commit
        if: ${{ env.RELEASE_MODE != 'update-preserve-notes' }}
        env:
          RELEASE_NOTES: ${{ runner.temp }}/release-notes.md
        run: |
          set -euo pipefail
          deno run --allow-read --allow-write --allow-run=git --allow-env scripts/release/notes.ts \
            --repo . \
            --tag "$RELEASE_TAG" \
            --commit "$GITHUB_SHA" \
            --mode "$RELEASE_MODE" \
            --repository "$GITHUB_REPOSITORY" \
            --output "$RELEASE_NOTES"
      - name: Publish verified assets with the selected release mode
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ARCHIVES: ${{ runner.temp }}/release-archives
          RELEASE_NOTES: ${{ runner.temp }}/release-notes.md
        run: |
          set -euo pipefail
          notes=()
          if [ "$RELEASE_MODE" != "update-preserve-notes" ]; then
            notes=(--notes "$RELEASE_NOTES")
          fi
          deno run -A scripts/release/publish.ts \
            --tag "$RELEASE_TAG" \
            --commit "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --event "$GITHUB_EVENT_NAME" \
            --mode "$RELEASE_MODE" \
            --archives "$RELEASE_ARCHIVES" \
            "${notes[@]}"
