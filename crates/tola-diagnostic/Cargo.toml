[package]
name = "tola-diagnostic"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Tola diagnostic records and codes"
license = "MIT"
repository = "https://github.com/tola-rs/tola-ssg"
documentation = "https://docs.rs/tola-diagnostic"

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
thiserror = "2.0.20"
tola-input.workspace = true
tola-typst.workspace = true
toml_edit = "0.25.13"
typst.workspace = true
schemars = { version = "1.2.2", optional = true }

[dev-dependencies]
serde_json = { version = "1.0.151", features = ["preserve_order"] }

[features]
json-schema = ["dep:schemars"]
