[package]
name = "tola-highlight"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license = "MIT"
description = "Syntax highlighting for Tola's terminal documentation and Nu previews"
keywords = ["syntax", "highlighting", "terminal", "typst"]
categories = ["text-processing"]
repository = "https://github.com/tola-rs/tola-ssg"
readme = "README.md"

[dependencies]
typst-syntax.workspace = true
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy", "plist-load", "yaml-load", "dump-load"] }
two-face = { version = "0.4.5", default-features = false, features = ["syntect-fancy"] }
