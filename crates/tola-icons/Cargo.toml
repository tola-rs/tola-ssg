[package]
name = "tola-icons"
version.workspace = true
edition = "2021"
rust-version.workspace = true
description = "Validated, self-contained SVG icons and Iconify collections"
license = "MIT"
repository = "https://github.com/tola-rs/tola-ssg"
documentation = "https://docs.rs/tola-icons"
readme = "README.md"
keywords = ["svg", "icons", "iconify", "wasm"]
categories = ["graphics", "web-programming"]
include = ["/Cargo.toml", "/LICENSE", "/README.md", "/src/**"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
roxmltree = "0.21.1"
svgtypes = "0.16.1"
cssparser = "0.37.0"
cssparser-color = "0.5.0"
percent-encoding = "2.3.2"
