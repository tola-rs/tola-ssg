[package]
name = "tola-pronunciations"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "The pronunciations Tola names for text: the tables it carries and the lookup over them"
license = "MIT AND CC-BY-SA-4.0 AND Unicode-3.0"
repository = "https://github.com/tola-rs/tola-ssg"
documentation = "https://docs.rs/tola-pronunciations"
readme = "README.md"
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/licenses/LICENSE-UNICODE",
    "/licenses/LICENSE-CC-BY-SA-4.0",
    "/licenses/EDRDG-LICENCE.html",
    "/licenses/JMDICT-DOCUMENTATION.html",
    "/licenses/JMDICT-DTD.xml",
    "/licenses/README.md",
    "/README.md",
    "/data/**",
    "/src/**",
]

[dependencies]
ruzstd = { version = "0.9.0", optional = true }

[features]
default = []
# Chinese word pronunciations from CC-CEDICT.
cedict = ["dep:ruzstd"]
# Japanese word pronunciations from JMdict.
jmdict = ["dep:ruzstd"]
# Han character pronunciations from the Unihan database.
unihan = ["dep:ruzstd"]

[dev-dependencies]
ruzstd = "0.9.0"
