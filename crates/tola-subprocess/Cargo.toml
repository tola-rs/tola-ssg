[package]
name = "tola-subprocess"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Trusted external command execution with bounded output capture, process-tree termination, and cancellation"
license = "MIT"
repository = "https://github.com/tola-rs/tola-ssg"

[dependencies]
process-wrap = { version = "=10.0.0", default-features = false, features = ["std", "process-group", "job-object"] }
thiserror = "2.0.20"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "event"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_System_Threading",
] }
