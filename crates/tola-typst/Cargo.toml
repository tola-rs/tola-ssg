[package]
name = "tola-typst"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license = "MIT"
description = "Independent Typst evaluation, compilation, and export with shared resources, virtual files, and structured diagnostics"
keywords = ["typst", "compiler", "bundle", "diagnostics", "world"]
categories = ["compilers", "text-processing"]
repository = "https://github.com/tola-rs/tola-ssg"
documentation = "https://docs.rs/tola-typst"
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["scan", "parallel"]
scan = []
# Loads and parses explicit sources on rayon's pool, the pool Typst's own Bundle
# compilation and export fan out on.
parallel = ["dep:rayon"]
embed-fonts = ["dep:ruzstd"]
network = ["typst-kit/system-downloader", "typst-kit/universe-packages"]
legacy-serialization = ["dep:serde_json"]

[dependencies]
typst.workspace = true
typst-bundle.workspace = true
typst-eval.workspace = true
typst-kit = { workspace = true, features = [
    "datetime",
    "scan-fonts",
    "system-packages",
] }
typst-html.workspace = true
typst-layout.workspace = true
typst-pdf.workspace = true
typst-render.workspace = true
typst-svg.workspace = true
ttf-parser = "0.25.1"

thiserror = "2.0.20"

parking_lot = "0.12.5"
rayon = { version = "1.12.0", optional = true }
comemo = "0.5.1"

rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", optional = true }
blake3 = "1.8.7"
ruzstd = { version = "0.9.0", optional = true }

[dev-dependencies]
tempfile = "3.27.0"
typst-library.workspace = true
typst-utils.workspace = true
