[package]
name = "tola-webp"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Pure-Rust lossy WebP encoder"
license = "MIT"
repository = "https://github.com/tola-rs/tola-ssg"

[dependencies]
fearless_simd = "=1.0.0"
image-webp = "=0.2.4"

[dev-dependencies]
fearless_simd = { version = "=1.0.0", features = ["force_support_fallback"] }
image = { version = "=0.25.9", default-features = false, features = ["webp", "jpeg", "png"] }
