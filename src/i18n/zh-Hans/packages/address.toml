# Simplified-Chinese documentation of `@tola/address`. English stays authoritative in the
# package's own Typst sources; a unit here overrides one of them.

overview = '''
tola 不会对路径做隐式拼接等处理，一切实际上由站点作者自己完成，本 package 仅提供可进行组合的地址 api。

@tola/address 将路径分成了三类。route 是每篇文章的路由，output 是每个文件对应的实际物理输出路径（相对于 `build.publish-dir`），url 是浏览器方面用户手写的链接（受 `[site]` 中的 `base-path` 影响）。

- route（`/guide/`）：文章的路由；以 `/` 开头、以 `/` 结尾，结尾带 `/` 指目录（`/guide/`），不带则指文件（`/about`）
- output：相对输出根（`build.publish-dir`）的文件路径，开头不带 `/`，比如 `#document("guide/index.html")` 的导出会写到 `<build.publish-dir>/guide/index.html`）
- url：output 对外提供服务的地址, 比如 hook 在 generate-outputs 阶段生成的文件，`url-of`、`url-of-asset` 会自动补上 `[site]` 里配置的 `base-path`，`url-of-asset` 用于 `[assets]` 声明的资产，会校验该声明确实存在，并在开启 cache-busting 时追加 `?h=<asset 哈希>`。页面里手写的 URL 是唯一要自己带上 `base-path` 的场景。


base-path 是服务端的事——GitHub Pages 的 project site 挂在 `/myrepo/` 下、nginx 的 `location`、`tola dev` 都算——它和 `build.publish-dir`（物理输出目录）是两层：产物里没有 `/docs/` 这一层。

tola 能自己分析出来的写入——`#document(...)` 的导出、Typst 原生 `asset()` 写入的文件、`generate-outputs` hook 经 `TOLA_HOOK_OUTPUT_DIR` 写出的文件——都直接落到 `build.publish-dir`，写的是物理输出路径（output）：相对 `build.publish-dir`、开头不带 `/`。这里不用 `/xxx` 这种绝对路径：绝对路径从文件系统根算起，会跳出发布目录，所以 output 一律相对。

浏览器 URL 才涉及 base-path：`url-of`、`url-of-asset` 会在返回的 URL 前面加上它（`base-path = "/docs/"` 时，`url-of("guide/index.html")` 得到 `/docs/guide/`）；页面里自己手写的 URL 没有这一步，要自己带。

```typ site
#import "@tola/address:0.0.0": url-of, url-of-asset
#document("index.html")[
  #link(url-of("guide/index.html"))[Guide]                      // base-path = "/docs/" 时是 /docs/guide/
  #html.img(src: url-of-asset("/assets/logo.png"), alt: "Logo") // /docs/assets/logo.png?h=<哈希>
]
```

`url-of` 把 output 换算成浏览器 URL（自动加 base-path，不检查文件是否存在）；`url-of-asset` 把 `[assets]` 声明过的 URL 换算成浏览器 URL（校验声明存在，cache-busting 开启时追加 `?h=<asset 哈希>`）。两者返回的 URL 直接拿去用，再手工拼一次前缀会得到 `/docs/docs/…`。

hook 产出的文件就是普通 output，页面里照常用 `url-of` 引用；需要文件内容本身含 URL（sitemap 等）时，用 `#document(...)` 写它，`url-of` 就在手边。
'''

[exports.slugify]

summary = [
  '''
纯函数：把文本变成一个 slug，一个可以直接放进 URL 或文件名的字符串。

slug 里保留字母、标记、数字，以及 URL 和文件名安全的标点：`slugify("Deep Notes")` 得到 `"deep-notes"`；其余字符都用来分隔单词，结果会做 NFC 规范化。

约束：文本里没有任何能构成 slug 的内容时报错；`mode`、`case`、`separator` 只接受各自列出的取值；`mode: "ascii"` 下读音随 `language`：只有主 `ja` 子 tag 按日语读汉字，其他任何 tag（包括 `en`）都按中文读。

Example - 先用默认设置，再带选项，把标题变成 slug：
''',
  '''
Example - 把汉字与带重音的文本转写成 ASCII；汉字按词读音，多音字跟随它所在的词：
''',
  '',
]

[exports.slugify.parameters]

text = "要变成 slug 的文本。"

case = "slug 采用的字母大小写：`lower`、`upper`、`capitalize` 或 `preserve`。"

language = "`ascii` 模式下用来选择汉字读音的 tag，例如 `\"zh\"`、`\"ja\"`，默认中文。主 `ja` 子 tag 按日语处理，不区分大小写（`\"JA-JP\"` 也能匹配）；其他 tag 一律按中文处理。"

mode = "规范化模式：`unicode`（默认，保留文字本身）或 `ascii`（把汉字按读音、带重音的字母转写成 ASCII）。"

separator = "单词之间的分隔符：`-` 或 `_`。"

[exports.join-route]

summary = [
  '''
纯函数：把 `segments`（一个数组）拼接为一条站点根 route。

每个分段都按原样保留，所以想要 slug、其他大小写或转写时，先对分段调用 `slugify`。内容源的 `route-segments` 只是文件布局给出的默认 route；文档实际以哪条 route 可达，由它自己的 output 决定。

约束：结果总是以 `/` 开头、以 `/` 结尾，不传分段就得到站点根 `/`；分段为空、为 `.`、为 `..`，或者包含 `/`、`\`，或者包含已发布文件名无法承载的字符时报错。

Example - 保留分段原样，再逐个 slug 后发布：
''',
  'Example - 取文件布局给出的默认 route：',
  '',
]

[exports.output-of]

summary = [
  '''
纯函数：一条站点根 route 发布到的输出文件。

route 是站点发布所用的路径，其中的 `%`、`#` 就是普通的文件名字符。以 `/` 结尾时，route 指向一个目录，该目录按自己的 `index.html` 发布：`/` 是 `index.html`，`/guide/` 是 `guide/index.html`；不带结尾 `/` 时，route 按字面指向文件：`/guide` 是 `guide`，`/manual.pdf` 是 `manual.pdf`。

约束：route 按原样取用，百分号编码的 URL 路径要先用 `decode-url-path` 解码，而且只解码一次。

Example - 由 route 得到输出文件：
''',
  'Example - 把字面 `%` 或 `#` 保留为文件名字符：',
  '',
]

[exports.route-of]

summary = [
  '''
纯函数：输出文件可达的站点根 route。

文件名恰为 `index.html` 时，取包含它的目录地址：`index.html` 是 `/`，`guide/index.html` 是 `/guide/`。其他文件名原样保留在 `/` 下：`404.html` 是 `/404.html`，`about` 是 `/about`。

`output-of(route-of(output))` 能把输出还原；把 `/guide/index.html` 先转成输出再转回来，得到的是规范 route `/guide/`。

Example - 由输出文件还原 route：
''',
  '',
]

[exports.url-of]

summary = [
  '''
依赖站点配置（`[site]` 的 `base-path`）：输出文件对外提供服务的浏览器 URL。

传入一个输出，例如 `guide/index.html`：它可以是文档自己的 output，也可以是 `output-of` 的结果。返回的 URL 前面会加上 `[site]` 的 `base-path`（默认 `/`）；传 `base-path: "/"` 覆盖为根部署，传 `origin` 得到绝对 URL（`origin: site.origin` 用站点自己的 origin）。

约束：`base-path` 必须以 `/` 开头、以 `/` 结尾；返回的 URL 只加一次它，再挂载就会重复；`origin` 是一个绝对的 `http`/`https` origin，其中不能有部署路径、凭据、query 或 fragment；输出名只编码一次，所以字面 `%20` 会变成 `%2520`。

任何输出路径都能在这里解析，包括 hook 产出的：这里不做检查，因为地址只是一个名字，不承诺文件存在。`[assets]` 声明拼写的 URL 不是输出路径——那类由 `url-of-asset` 解析，并带上它们的字节身份。

`route-of` 给的是同一份文件，不带部署路径、不接 `origin`、也不做百分号编码——部署在 `/docs/` 下时它仍是 `/guide/`。站点内部比较地址用它，写进浏览器用 `url-of`。

文档 output 不加部署前缀；返回的 URL 直接用于链接。最终 reference 检查会校验链接指向的 output 是否存在。

Example - 发布一个页面，并从另一篇文档链接到它：
''',
  'Example - 把输出挂到一个部署路径和一个 origin 下：',
  'Example - 输出名里的字面 `%20` 只编码一次：',
  'Example - 链接 hook 自己的产出，它没有任何 `assets` 声明为它命名：',
  '',
]

[exports.url-of.parameters]

output = "要挂载的输出路径。"

base-path = "部署路径；`auto` 取站点自身的 `base-path`。"

origin = "结果的绝对 origin。"

[exports.url-of-asset]

summary = [
  '''
依赖站点配置（`[assets]` 声明、`[site]` 的 `base-path`）：已声明资产 URL 对外提供服务的浏览器 URL。

参数是声明本身拼写的站点根 URL：

- `assets.files`：条目自己的 `url`，例如 `"/styles/base.css"`。
- `assets.trees`：树的 `url-prefix` 加上成员在树内的路径；`url-prefix = "/assets"`、树里有 `images/logo.svg` 时，对应 `url-of-asset("/assets/images/logo.svg")`。

URL 写成编码形式或解码形式都可以：`url-of-asset` 会先按路径解析一次，两种写法都能匹配到声明。构建时，它解析成该声明发布的地址，并在 `assets.cache-busting` 打开时追加 `?h=<identity>`：内容变了，地址跟着变，名称保持不变。

约束：返回的 URL 以 `/` 开头，并在前面加上 `site.base-path`，直接拿去用；再挂载一次就会重复；没有任何 `assets` 声明发布这个 URL 时调用处报错，即使该路径由别的生产者发布，比如 `resize-image` 的派生结果。

两者的区别：

| | `url-of(output)` | `url-of-asset(声明的 URL)` |
| --- | --- | --- |
| 输入 | output：`build.publish-dir` 下的文件路径，不带前导 `/`（`assets/logo.png`） | `[assets]` 声明拼写的站点根 URL，带前导 `/`（`/assets/logo.png`）；编码、解码两种写法都行 |
| 校验 | 什么都不查——地址只是名字，不承诺文件存在，hook 将来产出的文件也能解析 | 查 `[assets]` 声明——没声明过的 URL 在调用处报错，即使该路径由别的生产者写出 |
| 结果 | 挂载后的浏览器 URL（以 `/` 开头） | 挂载后的浏览器 URL（以 `/` 开头），`assets.cache-busting` 打开时追加 `?h=<identity>` |

编辑器源检查只解析挂载后的地址，不带 identity，因为它不渲染资产字节。`tola check` 会准备完整 output，包括资产 identity，但不发布它们。

hook 自己的产出正是这样的路径：页面用 `url-of("assets/…")` 链接它，两个调用彼此独立——这里传声明的拼写，绝不传另一个函数的结果。

Example - 解析站点在 `/assets` 下发布的文件：
''',
  '',
]

[exports.url-of-asset.parameters]

declared-url = "声明拼写的站点根资产 URL，例如 \"/app.js\"。"

[exports.decode-url-path]

summary = [
  '''
纯函数：把百分号编码的站点根 URL 路径恰好解码一次。

每个转义都会还原成它所指的字节，所以 `/caf%C3%A9/` 是 `/café/`，`/Hello%20World/` 是 `/Hello World/`。只在这里解码一次。

约束：参数只能是路径——传入 origin、query string 或 fragment 都会报错；转义的 `/` 或 `\` 同样会报错，因为层级只由未转义的 `/` 划分。

Example - 把百分号编码的路径恰好解码一次：
''',
  'Example - 把路径解码一次，再命名输出文件：',
  '',
]
