# Chinese prose for @tola/datalog; examples come from the package source.

overview = '''
用 `relation` 声明关系，再用事实、递归规则和查询组合它们。关系名不能为空，参数个数固定。字符串是常量；变量用 `var` 显式构造。

事实是没有变量的原子。规则和查询采用集合语义，相同的结果只出现一次。规则头、查询返回列和否定条件中的变量，都必须出现在同一规则或查询的非否定条件中。否定必须分层：依赖环中不能有否定边。查询结果始终是元组组成的数组。

常量支持 `none`、布尔值、整数、有限浮点数、decimal、字符串、bytes 和 datetime。类型彼此区分，例如 `1` 和 `1.0` 是不同的常量。内容和函数等复杂值可通过 ID 连接，再从自己的记录中查回原值。
'''

[exports.relation]
summary = ['''
创建一个函数，用来构造指定关系的原子。

同一数据库或查询中，同名关系的参数个数必须一致。
''']
[exports.relation.parameters]
name = "按原样比较的非空关系名。"
arity = "参数个数，必须是非负整数。"

[exports.var]
summary = ["创建变量。同一规则或查询中，同名变量表示同一个变量。"]
[exports.var.parameters]
name = "按原样比较的变量名。"

[exports.rule]
summary = ["用头部原子和零个或多个正条件、否定条件创建规则。"]
[exports.rule.parameters]
head = "要推导的原子。"
body = "以位置参数传入的条件。"

[exports.negate]
summary = ["把原子变成否定条件。"]
[exports.negate.parameters]
atom = "不得存在匹配行的原子。"

[exports.database]
summary = [
  '''
用没有变量的事实原子和规则构建不可变数据库。

Example - 用递归规则计算可达关系：
''',
  '',
]
[exports.database.parameters]
facts = "没有变量的事实原子，默认为 `()`。"
rules = "规则，默认为 `()`。"

[exports.query]
summary = [
  '''
用正条件和否定条件查询数据库。

Example - 连接参考条目与记录，并排除已撤回的条目：
''',
  '''
`select` 按输出列的顺序列出变量。选择列为空时，所有条件成立返回 `((),)`，否则返回 `()`。结果行不重复；即使只有一列，每行也仍是元组。
''',
]
[exports.query.parameters]
database = "要查询的数据库。"
select = "按输出列顺序排列的变量。"
where = "要匹配的条件。"
