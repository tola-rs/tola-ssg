# Simplified-Chinese documentation of `@tola/graph`. English stays authoritative in the
# package's own Typst sources; a unit here overrides one of them.

overview = '''
用两组你自己提供的值——节点和边——建一张图，然后查看、遍历、缩小它。

- 建图：`from-records`
- 查看：`node-keys`、`has-node`、`node-data`、`edges`、`in-edges`、`out-edges`
- 遍历：`reachable`
- 缩小：`select-edges`、`induced`

节点键是提取函数返回的字符串；默认就是节点值本身，所以字符串节点不必写提取函数。键唯一，空字符串也是普通键。边可以是平行边、环或自环；没有边的节点仍然是节点。所有结果都保持你传入的顺序：节点按登记顺序，边按输入顺序，你给的值原样返回。边记录还带有它在原图中的 `index`；这个 index 只在当前图以及从它筛出的图中标识这条边，换一次构造就不再通用。

图只能通过下面的函数读取，字段是私有的。
'''

[exports.from-records]

summary = [
  '''
从节点值和边值建图。

`node-key` 读取节点的键，`source` 和 `target` 读取边的两端。默认把字符串节点当作它自己的键，并从边的 `source`、`target` 字段取端点，所以你的记录可以带上其他内容。

约束：`nodes`、`edges` 必须是数组；每个提取函数对每个输入值各调用一次；`node-key` 必须返回唯一的字符串；每条边的两端都必须指向已登记的节点。

Example - 建图并读回来：
''',
  '''
Example - 用你自己的记录，并指定字段名：
''',
  '',
]

[exports.from-records.parameters]

nodes = "按登记顺序排列的节点值。"

edges = "按输入顺序排列的边值。"

node-key = "接收一个节点，返回它的字符串键。"

source = "接收一条边，返回它的源节点键。"

target = "接收一条边，返回它的目标节点键。"

