[exports.induced]

summary = [
  '''
保留 `keys` 里的节点，以及两端都在其中的边。

重复的键只算一次。节点保持登记顺序，边保持输入顺序，你给的值原样保留；只要有一端不在 `keys` 里，这条边就会被丢掉。

约束：每个键都必须是已登记的字符串节点键；未知键会报错。

