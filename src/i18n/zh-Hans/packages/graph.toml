[exports.reachable]

summary = [
  '''
按登记顺序返回从 `roots` 能走到的节点，起点也算在内。

重复的起点只算一次。`"out"` 沿边正向走，从源到目标；`"in"` 反向走，从目标到源。即使没有任何边碰到它，起点也能走到自己；不给起点就没有节点。

约束：每个起点都必须是已登记的字符串键；未知起点会报错。

Example - 从一个页面正向走：
''',
  '''
