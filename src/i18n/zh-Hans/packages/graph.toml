[exports.select-edges]

summary = [
  '''
保留 `keep` 返回 `true` 的边。

`keep` 每次接收一条边记录。节点全部保留，即使一条边都不剩；留下的边保持原来的 `index` 和相对顺序，所以 index 出现空洞是正常的。

约束：`keep` 必须返回 bool，其他值会报错。

