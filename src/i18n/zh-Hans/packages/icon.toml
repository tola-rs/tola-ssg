# Simplified-Chinese documentation of `@tola/icon`. English stays authoritative in the package's
# own Typst sources; a unit here overrides one of them.

overview = '''配置好的图标：内联 SVG、SVG 字节或已发布的 URL。

图标染成什么颜色由它自己的 SVG 决定。用 `currentColor` 画的图标跟随所在页面的 `color`，主题或 CSS 类就能改变它的颜色；fills 与 strokes 写死颜色的图标保持自己的颜色。首选本来就画成这样的图标，`lucide` 集合的每一个图标都是。'''

[exports.icon]

summary = [
  '''
把配置好的图标画成内联 SVG，高度为 1em。

它产生的是 HTML 元素，所以要在 HTML 文档里调用。`icon-bytes` 与 `icon-url` 的返回值任何目标都能用。

图标 id 取自站点在 `tola.toml` 的 `icons.collections` 下声明的 collection：`tola help "[icons]"` 说明每种来源类型，`tola inspect icons` 列出已配置的 namespace，指定其中一个还会列出它底下的图标名。

图标染成什么颜色由它自己的 SVG 决定。用 `currentColor` 画的图标跟随所在页面的 `color`，主题或 CSS 类就能改变它的颜色；fills 与 strokes 写死颜色的图标保持自己的颜色。collection 本来就可以画成前者：`lucide` 集合的每个图标都用 `currentColor` 画，拿来就直接跟着页面的文字颜色走。

Example - 在 HTML 文档里渲染一个配置好的图标：
''',
  'Example - 把图标插进 HTML 文档，同时用已发布的图标 URL 直接当图片地址：',
  'Example - 把收集到的图标字节交给 `asset()` 发布：',
  '',
]

[exports.icon.parameters]

id = "`\"collection:name\"`，取自你在 `icons.collections` 下声明的集合；名称区分大小写。"

label = "`none` 表示装饰性图标；非空的 `label` 表示信息性图片。只含空白的 `label` 会报错。"

attrs = "值为字符串的根 SVG 属性，例如 `class`、`width`、`height`、`style`。`aria-label`、`aria-labelledby`、`aria-hidden`、`role`、`focusable` 由 `label` 掌管，在 `attrs` 里写其中任何一个都会报错；`class` 与 `style` 会追加到 SVG 已有的值上。"

[exports.icon-bytes]

summary = [
  '''
配置好的图标的规范化 SVG 字节，可交给 `asset()` 或 Typst 的 `image(bytes)`。

只有 `icon-url()` 会把图标发布成 SVG 文件。

Example - 把图标的字节发布成 Bundle 文件：
''',
  '',
]

[exports.icon-bytes.parameters]

id = "配置好的图标的标识，例如 `\"brand:mark\"`。"

[exports.icon-url]

summary = [
  '''
发布配置好的图标，并返回它对外提供服务的 URL。

一次构建只发布文档请求过的图标。URL 以 `/` 开头，包含 `site.base-path`，可以直接写进 HTML 的图片或链接属性。规范化 SVG 字节相同的图标共用一个已发布文件。

页面的 `color` 到不了已发布的图标：独立的文件继承不到它。想让图标跟随主题色，请用 `icon()`。

Example - 发布图标并在图片里使用它的 URL：
''',
  '',
]

[exports.icon-url.parameters]

id = "配置好的图标的标识，例如 `\"brand:mark\"`。"
