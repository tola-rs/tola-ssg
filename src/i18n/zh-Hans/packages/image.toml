source = "相对本次调用的路径字符串、已解析的路径，或原始图像字节。"

quality = "JPEG/WebP 质量为 0 到 100，默认 75；`none` 表示无损 WebP。PNG 忽略它。"

sizes = "这个元素在页面上占多宽的 CSS 描述，默认 `100vw`。"

widths = "`auto`（默认，采用源图自身的宽度），或要生成的像素宽度列表。"
