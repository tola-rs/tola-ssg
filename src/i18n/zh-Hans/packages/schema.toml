要求字符串匹配一个 Typst regex 值；字符串形式的模式一律拒绝。

匹配搜索字符串中任意位置，要约束整串请加 anchor。匹配直接作用于解析后的字符串本身，通过后原样返回。

Example - 要求匹配正则表达式：
