# Simplified-Chinese documentation of `@tola/site`. English stays authoritative in the package's
# own Typst sources; a unit here overrides one of them.

overview = "本站的配置值，解析自 `tola.toml`"

[exports.site]

summary = [
  '''
本站的配置值，解析自 `tola.toml`。

`site` 为每项 `[site]` 设置提供一个条目，另外还有派生出来的 `url`：`origin`、`base-path`、`url`、`title`、`authors`、`description`、`language`、`copyright` 和 `extra`。在 `[site.extra]` 下声明自己的值，它们会出现在 `extra` 中；其中的 TOML 日期或日期时间会以字符串形式出现。

`base-path` 是主机根之下的部署路径，默认是 `/`。`url` 把 `origin` 和 `base-path` 拼成站点的规范地址。没有声明 `site.origin` 的站点只发布相对地址，所以它的 `url` 是 `none`。

`title`、`description` 和 `copyright` 是你写在 `tola.toml` 里的文本；没有配置该项时它们为空。`authors` 为每位作者保存一条 `(name:, email:, url:)` 记录。`language` 包含 `tag`、`lang`、`script` 和 `region`：`tag` 是完整的规范 tag，例如 `zh-Hans-CN`，各部分就是 `#set text` 接受的值。声明的语言缺少对应部分时，`script` 是 `auto`，`region` 是 `none`。

Example - 读取默认站点的配置值：
''',
  'Example - 读取已配置站点的配置值：',
  '',
]
