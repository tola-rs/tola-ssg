[exports.feed]

summary = [
  '''
通过 metadata 声明一个 feed 输出。把返回的内容放进根程序：声明只在根程序里生效。站点需要 `site.origin`，因为 feed 的每个地址都是绝对地址；feed 标题从 `title` 或 `site.title` 取得，并且不能只含空白。

每个条目都需要 `target` 和 `published`，还可以设置 `id`、`title`、`updated`、`summary`、`content` 和 `authors`。`target` 是输出路径、`(output:, fragment:)` 字典、label 或 location；条目会链接到对应文档，并带上 target 所指的 fragment。`id` 为 `auto` 或省略时取解析后的目标 URL，`title` 为 `auto` 或省略时取目标文档自己的标题。

`summary` 是摘要，`content` 是条目正文，通常用于全文。两者独立：只设置 `summary` 就发布摘要，指定 `target` 不会把目标文档的正文复制进 feed。各格式分别写入这两个字段：

| 格式 | Summary | Content |
| --- | --- | --- |
| RSS | `<description>` | `<content:encoded>`，供读取全文的阅读器使用 |
| Atom | `<summary>` | `<content>`：纯字符串为 `text`，片段或文档选择为 `html` |
| JSON Feed | `summary`，转为纯文本 | 字符串为 `content_text`，片段或文档选择为 `content_html` |

省略正文或传 `none` 时，RSS 与 Atom 不写 content 元素；JSON Feed 写入空的 `content_text`。

每种格式各自填写修改日期。Atom 的 `updated` 默认取 `published`。RSS 不写修改日期。JSON Feed 只在条目设置了 `updated` 时才写 `date_modified`。

字符串是纯文本：`"<strong>Note</strong>"` 会保留为字面文本。Typst content 支持文本、换行、强调、加粗、删除线与 URL 链接。Tola 遍历这些原始元素，生成便于 feed 阅读器使用的 HTML 片段，不运行文档 show rule 或排版。例如，`content: [*Note*]` 变成 `<strong>Note</strong>`，而 `content: [= Heading]` 会报错。带样式、contextual 或已经处理过的 content 也会被拒绝。标题、表格、图片、数学与渲染后的代码应使用文档选择。链接接受相对路径与 fragment，以及绝对 HTTP(S)、`mailto`、`tel` URL。相对链接按条目的 target URL 解析。

`content: (document: output, id: "post-body")` 选择最终 HTML 中带这个 id 的元素及其后代。省略 `id` 或传 `none` 时选择整个 body；`summary` 不接受文档选择。给 article 显式设置 HTML id，就能排除导航与页脚。这个 id 必须在选定 HTML 文档中恰好出现一次：空 id、找不到或重复的 id，以及非 HTML 文档，都会让构建失败。别的 output 里的 id 不会匹配。

选择会在该子树外保留祖先容器，但不带上祖先的其他子元素，并包含 head 里的样式与样式表链接。HTML 文档容器会变成 `div`。URL 属性按原文档的 URL 与第一个 `<base href>` 解析成绝对地址；CSS 内的 URL 不改写，也不复现整页的 CSS cascade。

三个 id 的用途不同：feed 的 `id` 标识 Atom feed，条目的 `id` 向订阅者标识这一条内容，`content.id` 则选择 HTML 元素。页面移动时保持显式的条目 id 不变。条目 id 必须非空白，并且在 feed 内唯一。Atom 要求标识符为绝对 URI，并且 feed 本身要有作者；非空 feed 也可以改为给每个条目设置作者。

文档内的 label 或 location 需要一个导出的 anchor，所以在站点某处链接到它（`#link(<label>)`、`@label` 或 `#outline()`）：导出只会给有链接指向的元素分配 `id`。缺少这个 anchor 时，构建会直接失败，绝不会改为链接整篇文档。整篇文档的 label 或 location 不需要正文 anchor。`fragment` 按原样保留，并且必须指向目标文档导出的 anchor。

`published` 和 `updated` 接受含完整日历日期的原生 datetime，或带时区的严格 RFC 3339 字符串，使用与 `@tola/schema` 的 `timestamp` 相同的解析器。原生值按 UTC 解释，只有日期而没有时间时取午夜。纯日期字符串、纯时间值、首尾空白和闰秒都会被拒绝。schema 返回时间戳记录时，传入它的 `.rfc3339`。feed 格式化保留数值时区偏移和至多九位小数；RSS 日期只保留整秒。

Example - 发布只有摘要、没有全文正文的 RSS：
''',
  'Example - 发布摘要与 article 的完整 HTML，排除导航：',
  '''
starter 的 `site/seo.typ` 把源 metadata `feed-summary` 映射到条目的 `summary`，把 `feed-content` 映射到 `content`。省略 `feed-content` 或传 `none` 时，这个 recipe 会选择页面的整个 body。因此，只设置 `feed-summary` 仍会发布全文 RSS。需要只有摘要的 feed 时，把这个 recipe 改为传入 `content: none`。

Example - 给 starter 页面单独编写一个便于 feed 阅读器使用的正文：

在启用了 `feed` feature 的站点里，把以下声明放在 `content/note.typ` 开头，后面接页面的普通正文。设置 `site.origin` 与 `site.title`，让 starter 输出 feed。下面的 `feed-content` 只使用支持的文本片段元素。
''',
  '',
]

[exports.feed.parameters]

output = "输出文件，相对站点输出根目录；`auto` 跟随 `format`：`rss` 取 `feed.xml`，`atom` 取 `atom.xml`，`json` 取 `feed.json`。"

format = "feed 格式：`rss`、`atom` 或 `json`。"

id = "feed 标识符；`auto` 取 feed 自己的绝对 URL。"

title = "feed 标题；`auto` 取站点标题。"

description = "feed 描述；`auto` 取站点描述。"

language = "feed 语言；`auto` 取站点的 language tag。"

authors = "feed 作者；`auto` 取站点的作者。"

entries = "要发布的条目，按你给出的顺序。"

[exports.sitemap]

summary = [
  '''
通过 metadata 声明一个 sitemap 输出。和 `feed` 一样，把返回的内容放进根程序。

每个 target 都指向整篇文档。解析到元素的 target（文档内的 label 或 location，或写有 `fragment` 的字典）会直接报错，同一个 target 出现两次也会报错。列出的 URL 都是绝对 URL，因此站点需要 `site.origin`。

`lastmod` 接受原生日期、严格的 `YYYY-MM-DD` 字符串，或 `@tola/schema` 接受的时间戳输入。日期保持为纯日期；原生 datetime 按 UTC 解释，时间戳字符串保留数值时区偏移，格式化后至多保留九位小数。date 和 timestamp schema 共用这些校验；解析得到时间戳记录时，传入它的 `.rfc3339`。

Example - 选择整篇文档，并为其中一篇注明日期：
''',
  '',
]

[exports.sitemap.parameters]

output = "输出文件，相对站点输出根目录。"

targets = "sitemap 列出的文档，每一项是输出路径、label、location，或为其注明日期的 `(target:, lastmod:)` 字典。"
