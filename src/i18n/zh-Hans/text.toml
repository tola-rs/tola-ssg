# The Simplified-Chinese phrases `tola help` writes around its pages. Each key names one
# `HelpText` phrase in `src/i18n/mod.rs`; English is the phrase's own spelling. Page section
# headings and every other label stay English in both languages.

[text]
help-usage = "查看命令选项，请用 `tola <command> --help`。\n\n`tola help` 提供 Tola 内置的离线文档：`tola.toml` 配置（`tola help \"[build]\"`）和 `@tola/xxx` 内置包（`tola help \"@tola/address\" slugify`）。加上 `-i` 或 `--interactive` 可交互式浏览，用鼠标点击链接，或按 Tab 选择跳转目标。文档默认使用英文；加上 `--lang zh` 可阅读简体中文。\n\n`tola skill` 提供面向 agent 的站点编写指南。agent 可以结合这份指南和 `tola help` 了解 Tola 与 Typst，帮助你组织站点、理解相关概念。"
