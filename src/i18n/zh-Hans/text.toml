# The Simplified-Chinese phrases `tola help` writes around its pages. Each key names one
# `HelpText` phrase in `src/i18n/mod.rs`; English is the phrase's own spelling. Page section
# headings and every other label stay English in both languages.

[text]
help-usage = "查看 CLI 命令本身，请用 `tola <command> --help`。\n\n`tola help` 用于查看 Tola 内置的离线文档：`tola.toml` 的配置选项、`@tola/xxx` 的内置 packages、以及一些用于演示的 demo（可以用 `tola preview` 预览实际发布的 HTML 产物，也可以导出后自行编辑体验）。`tola help` 还支持 `-i`/`--interactive` 交互式浏览；在该模式下，你可以直接用鼠标点击进行跳转，或按下 Tab 进行基于键盘的快速导航。`--lang` 切换语言（目前只有中英文）。\n\nTola 还提供 `tola skill` 命令方便 agent 读取；agent 可以通过 `tola help` 与 `tola skill` 快速了解 Tola 与 Typst，辅助用户组织站点，并向用户讲解 Tola 的概念。"
demo-usage = "阅读完整示例、浏览源文件，并在需要时预览或导出站点。"
demo-source = "内嵌源文件，只读。先导出完整 Demo，再编辑自己的副本。"
demo-actions = "使用 `-i` 进入 Preview、Stop、Export、Export-and-edit 与 Open-browser。命令行可添加 `--preview` 或 `--export DIR`；`--edit` 用编辑器打开导出的副本。预览运行时，屏幕上会显示它服务的地址。"
